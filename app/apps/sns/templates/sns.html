<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SNS Mock</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/app/sns/static/style.css">
</head>
<body{% if user %} data-user-id="{{ user.user_id }}"{% endif %}>
    <h1>SNS Mock</h1>
    <p><a href="/about">このアプリについて</a></p>
    <p id="error" role="alert"{% if not error %} hidden{% endif %}>{{ error }}</p>
    {% if user %}
    <p>{{ user.name }} として参加中</p>
    <p id="connection-status" hidden></p>
    <form method="post" action="/app/sns/post" data-action="post">
        <label for="text">投稿</label>
        <textarea id="text" name="text" rows="3" maxlength="500" required>{{ text }}</textarea>
        <button type="submit">投稿する</button>
    </form>
    <div id="posts">
    {% for post in posts %}
    <article class="post" data-id="{{ post.id }}">
        <strong class="post-name">{{ post.name }}</strong>
        <p class="post-text">{{ post.text }}</p>
        {% if post.user_id == user.user_id %}
        <div class="post-actions">
            <details>
                <summary>編集</summary>
                <form method="post" action="/app/sns/posts/{{ post.id }}/edit" data-action="edit" data-id="{{ post.id }}">
                    <label for="edit-{{ post.id }}">投稿を編集</label>
                    <textarea id="edit-{{ post.id }}" name="text" rows="3" maxlength="500" required>{{ post.text }}</textarea>
                    <button type="submit">保存する</button>
                </form>
            </details>
            <form method="post" action="/app/sns/posts/{{ post.id }}/delete" data-action="delete" data-id="{{ post.id }}">
                <button type="submit">削除</button>
            </form>
        </div>
        {% endif %}
    </article>
    {% endfor %}
    </div>
    <script src="/app/sns/static/sns.js" defer></script>
    {% else %}
    <form method="post" action="/app/sns/join">
        <label for="name">名前</label>
        <input id="name" name="name" value="{{ name }}" minlength="1" maxlength="30" required>
        <button type="submit">参加</button>
    </form>
    {% endif %}
</body>
</html>
