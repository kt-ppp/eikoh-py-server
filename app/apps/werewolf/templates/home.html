<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>人狼</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/app/werewolf/static/style.css">
    <script src="/app/werewolf/static/rules.js" defer></script>
</head>
<body>
    <nav><a href="/">アプリ一覧</a></nav>
    <h1>人狼</h1>
    {% include 'rules.html' %}
    <p role="alert" class="error"{% if not error %} hidden{% endif %}>{{ error }}</p>
    {% if not user %}
    <section class="panel">
        <h2>名前を入力</h2>
        <form method="post" action="/app/werewolf/join">
            <label for="name">名前</label>
            <input id="name" name="name" value="{{ name }}" minlength="1" maxlength="30" required autocomplete="nickname">
            <input type="hidden" name="code" value="{{ code }}">
            <button type="submit">参加する</button>
        </form>
    </section>
    {% else %}
    <p><strong>{{ user.name }}</strong> として参加中</p>
    <div class="columns">
        <section class="panel">
            <h2>ルームに入る</h2>
            <form method="post" action="/app/werewolf/rooms/join">
                <label for="code">ルームコード</label>
                <input id="code" name="code" value="{{ code }}" minlength="6" maxlength="6" pattern="[A-Za-z0-9]{6}" required autocomplete="off">
                <button type="submit">ルームに入る</button>
            </form>
        </section>
        <section class="panel">
            <h2>ルームを作る</h2>
            <form method="post" action="/app/werewolf/rooms">
                <label for="room-name">ルーム名</label>
                <input id="room-name" name="name" value="{{ user.name }}のルーム" minlength="1" maxlength="30" required>
                <label for="capacity">定員（4〜16人）</label>
                <input id="capacity" type="number" name="capacity" value="8" min="4" max="16" required>
                <button type="submit">ルームを作る</button>
            </form>
        </section>
    </div>
    {% if my_rooms %}
    <section class="panel">
        <h2>参加中のルーム</h2>
        <ul>
        {% for room in my_rooms %}
            <li><a href="/app/werewolf/rooms/{{ room.code }}">{{ room.name }}（{{ room.code }}）</a></li>
        {% endfor %}
        </ul>
    </section>
    {% endif %}
    {% endif %}
</body>
</html>
