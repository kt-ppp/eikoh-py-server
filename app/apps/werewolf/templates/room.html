<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ room.name }} - 人狼</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/app/werewolf/static/style.css">
    <script src="/app/werewolf/static/rules.js" defer></script>
    <script src="/app/werewolf/static/room.js" defer></script>
</head>
<body data-room-code="{{ room.code }}" data-user-id="{{ user.user_id }}">
    <nav><a href="/">アプリ一覧</a> · <a href="/app/werewolf/">人狼のルーム一覧</a></nav>
    <h1>{{ room.name }}</h1>
    <p>ルームコード：<strong id="room-code">{{ room.code }}</strong></p>
    <p class="share"><label for="room-link">参加用リンク</label><input id="room-link" type="text" readonly><button id="copy-link" type="button">コピー</button><span id="copy-status" role="status"></span></p>
    {% include 'rules.html' %}
    <p id="connection-status" role="status">接続中…</p>
    <p id="error" class="error" role="alert" hidden></p>
    <section class="panel phase-panel" aria-live="polite">
        <h2 id="phase-title">{{ room.phase_label }}</h2>
        <p id="countdown"></p>
        <p id="phase-help"></p>
        <p id="winner"></p>
        <div id="skip-panel" hidden>
            <p id="skip-status" role="status"></p>
            <button id="skip-time" type="button">時間をスキップ</button>
            <p id="skip-help"></p>
        </div>
    </section>
    <div class="columns">
        <section class="panel">
            <h2>あなたの役職</h2>
            <p><strong id="role-name"></strong> <span id="alive-status"></span></p>
            <p id="role-description"></p>
            <p id="teammates"></p>
            <form id="action-form" hidden>
                <label id="target-label" for="target">対象</label>
                <p id="action-help"></p>
                <select id="target" required></select>
                <button type="submit">対象を決定</button>
                <p id="selection-status" role="status"></p>
            </form>
            <h3>自分への通知</h3>
            <ul id="private-log"></ul>
        </section>
        <section class="panel">
            <h2>参加者 <span id="player-count"></span></h2>
            <ul id="players"></ul>
            <p id="settings-summary"></p>
            <form id="leave-form" method="post" action="/app/werewolf/rooms/{{ room.code }}/leave" hidden>
                <button type="submit">退室する</button>
            </form>
        </section>
    </div>
    <section id="owner-panel" class="panel" hidden>
        <h2>ルームの設定</h2>
        <form id="settings-form">
            <div class="settings-grid">
                <label>定員（4〜16）<input type="number" name="capacity" min="4" max="16" required></label>
                <label>人狼<input type="number" name="wolves" min="1" max="7" required></label>
                <label>占い師<input type="number" name="seer" min="0" max="1" required></label>
                <label>騎士<input type="number" name="guard" min="0" max="1" required></label>
                <label>霊媒師<input type="number" name="medium" min="0" max="1" required></label>
                <label>狂人<input type="number" name="madman" min="0" max="1" required></label>
                <label>夜（秒）<input type="number" name="night_seconds" min="5" max="600" required></label>
                <label>昼の議論（秒）<input type="number" name="discussion_seconds" min="10" max="1800" required></label>
                <label>投票（秒）<input type="number" name="vote_seconds" min="5" max="600" required></label>
            </div>
            <p>残りは村人になります（4人以上で開始）。</p>
            <button type="submit">設定を保存</button>
        </form>
        <button type="button" id="start-game">ゲームを開始</button>
    </section>
    <section id="restart-panel" class="panel" hidden>
        <button type="button" id="reset-game">次のゲームを準備</button>
    </section>
    <div class="columns">
        <section class="panel">
            <h2 id="chat-title">公開チャット</h2>
            <ol id="messages" class="scroll-list" aria-live="polite"></ol>
            <form id="chat-form">
                <label for="chat-text">発言（500文字まで）</label>
                <textarea id="chat-text" rows="2" maxlength="500" required></textarea>
                <button type="submit">送信</button>
                <p id="chat-help"></p>
            </form>
        </section>
        <section class="panel">
            <h2>ゲームの経過</h2>
            <ol id="game-log" class="scroll-list" aria-live="polite"></ol>
        </section>
    </div>
    <noscript><p>JavaScriptを有効にして、ページを開き直してください。</p></noscript>
    <script id="initial-room" type="application/json">{{ {'room': room, 'server_time': server_time}|tojson }}</script>
</body>
</html>
